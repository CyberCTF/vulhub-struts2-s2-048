# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Apache Struts2 S2-048 OGNL Injection (Struts 1 Plugin) (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-048, vendored in app/, run from the published image vulhub/struts2:2.3.32-showcase.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-048

networks:
  lab: { cidr: 10.61.11.0/24, internet: false }

machines:
  struts2:
    networks: { lab: 10 }
    services: [{ port: 8080, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      image: vulhub/struts2:2.3.32-showcase

checks:
  - name: the application answers
    http: http://struts2:8080/showcase/
    wait: 120
  - name: the showcase serves the Struts 1 integration page
    script: checks/app.sh
    wait: 60

message: |
  The Struts2 2.3.32 showcase answers at http://localhost:{{ machines.struts2.services.0.publish }}/showcase/.
  Look at the Struts 1 integration example and what it does with the name you give it.
